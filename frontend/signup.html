<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Titan | TITAN FITNESS ACADEMY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
    html, body {
        height: 100%;
        overflow: hidden;
    }

    main {
        height: 100vh;
        padding-top: 90px; /* clears the fixed header */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-y: auto; /* safety: still scrolls internally on very short/small screens instead of clipping content */
    }
</style>
</head>
<body>

    <header class="site-header app-header">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <span class="brand-main">TITAN</span>
                <span class="brand-sub">FITNESS ACADEMY</span>
            </a>
            <div class="nav-actions">
                <a href="login.html" class="login-link">Already a member? Login</a>
            </div>
        </div>
    </header>

    <main style="min-height: 100vh; display: flex; align-items: center; padding: 140px 0 60px;">
        <div class="container" style="max-width: 480px;">

            <div class="section-label"><span>JOIN</span> TITAN FITNESS ACADEMY</div>
            <h1 style="font-size: 42px; margin: 16px 0 8px;">CREATE YOUR<br><span style="color:var(--yellow)">ACCOUNT</span></h1>
            <p style="margin-bottom: 32px;">Sign up, tell us what plan interests you, and our team will activate your access.</p>

            <form id="signupForm" class="card">

                <div class="field">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required placeholder="Your name">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
                </div>

                <div class="field">
                    <label for="plan">Which plan interests you?</label>
                    <select id="plan" required>
                        <option value="" disabled selected>Select a plan</option>
                        <option value="Standard">Standard — Full gym access</option>
                        <option value="Premium">Premium — Gym + all classes</option>
                        <option value="Elite">Elite — Premium + personal coaching</option>
                    </select>
                </div>

                <div class="field-error" id="formError"></div>

                <button type="submit" class="primary-button btn-block" id="submitBtn">
                    CREATE ACCOUNT <span>↗</span>
                </button>

            </form>

            <div id="successMessage" class="card" style="display:none; margin-top: 20px; text-align:center;">
                <p style="color: var(--white);">Account created! Check your email to confirm, then log in to get started.</p>
            </div>

        </div>
    </main>

    <script type="module" src="./js/signup.js"></script>
</body>
</html>
