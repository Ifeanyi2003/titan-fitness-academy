<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TITAN FITNESS ACADEMY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <span class="brand-main">TITAN</span>
                <span class="brand-sub">FITNESS ACADEMY</span>
            </a>
            <div class="nav-actions">
                <a href="signup.html" class="login-link">New here? Join Titan</a>
            </div>
        </div>
    </header>

    <main style="min-height: 100vh; display: flex; align-items: center; padding: 140px 0 60px;">
        <div class="container" style="max-width: 440px;">

            <div class="section-label"><span>WELCOME</span> BACK</div>
            <h1 style="font-size: 42px; margin: 16px 0 8px;">MEMBER<br><span style="color:var(--yellow)">LOGIN</span></h1>
            <p style="margin-bottom: 32px;">Log in to view your dashboard and track your progress.</p>

            <form id="loginForm" class="card">

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Your password">
                </div>

                <div class="field-error" id="formError"></div>

                <button type="submit" class="primary-button btn-block" id="submitBtn">
                    LOG IN <span>↗</span>
                </button>

            </form>

        </div>
    </main>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
